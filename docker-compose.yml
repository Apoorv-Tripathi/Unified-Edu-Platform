version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: education_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: education_platform
    volumes:
      - mongodb_data:/data/db
    networks:
      - education_network

networks:
  education_network:
    driver: bridge

volumes:
  mongodb_data: